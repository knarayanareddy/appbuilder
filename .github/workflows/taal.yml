name: Taal (web checks + Android APK)

on:
  push:
    branches: ["**"]
    paths:
      - "dutch-learning/**"
      - ".github/workflows/taal.yml"
  pull_request:
    paths:
      - "dutch-learning/**"
      - ".github/workflows/taal.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: dutch-learning

jobs:
  web:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dutch-learning/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Keep the web build
        uses: actions/upload-artifact@v4
        with:
          name: taal-web
          path: dutch-learning/dist
          if-no-files-found: error

  android:
    name: Debug APK
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dutch-learning/package-lock.json

      # Capacitor 8 builds against a recent Android SDK and needs JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK preflight
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          java -version
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true

      - run: npm ci
      - run: npm run build

      # The native project is generated here rather than committed: it is a build
      # artifact of capacitor.config.ts and rots if kept in the repo.
      - name: Create the Android project
        run: npx cap add android

      - name: Sync the web build into it
        run: npx cap sync android

      # Without this the phone's speech engine is invisible to the app and every
      # card is silent. See scripts/patch-android-manifest.py.
      - name: Declare the text-to-speech intent and microphone
        run: python3 scripts/patch-android-manifest.py

      # The 39 MB Dutch model is downloaded here, never committed: it is a release
      # artifact of another project. If the download fails the build still ships — the
      # app hides the microphone when the model is absent, and typed practice is intact.
      - name: Fetch the Dutch speech model
        continue-on-error: true
        run: |
          mkdir -p android/app/src/main/assets
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/model.zip" \
            https://alphacephei.com/vosk/models/vosk-model-small-nl-0.22.zip
          unzip -q "$RUNNER_TEMP/model.zip" -d "$RUNNER_TEMP/model"
          mv "$RUNNER_TEMP/model/vosk-model-small-nl-0.22" android/app/src/main/assets/model-nl
          du -sh android/app/src/main/assets/model-nl

      # Writes the local Capacitor plugin and its Gradle dependencies into the generated
      # project. Idempotent; see scripts/android-speech.mjs.
      - name: Add on-device speech recognition
        run: node scripts/android-speech.mjs

      - name: Accept SDK licences
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            echo "licences accepted with $SDKMANAGER"
          else
            echo "no sdkmanager on this image — Gradle will use what is installed"
          fi

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # Each runner generates its own debug keystore, so without this every build
      # would have a different key and the next APK would refuse to install over
      # the previous one — and an uninstall deletes the database. See keystore/README.md.
      - name: Sign with the pinned key
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          TOOLS="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign \
            --ks keystore/taal.p12 \
            --ks-key-alias taal \
            --ks-pass pass:taal-dev-key \
            --key-pass pass:taal-dev-key \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          cp "$RUNNER_TEMP/signed.apk" "$APK"
          echo "signed; verifying:"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Report the APK
        run: |
          grep -A5 "<queries>" android/app/src/main/AndroidManifest.xml
          ls -lh android/app/build/outputs/apk/debug/

      # Which key signed this build decides whether a new APK installs over the
      # previous one (keeping progress) or demands an uninstall (losing it). The
      # digest is published in the release notes so builds can be compared without
      # downloading anything.
      - name: Note the signing certificate
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)/apksigner"
          RAW="$RUNNER_TEMP/verify.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RAW" 2>&1 || true

          DIGEST="$(tr -d ':' < "$RAW" | grep -o -E '[0-9a-fA-F]{64}' | head -1 | tr 'A-F' 'a-f')"
          SCHEMES="$(grep -E '^Verified using v' "$RAW" | tr '\n' ' ' || true)"
          printf '%s\n' "${DIGEST:-unreadable}" > "$RUNNER_TEMP/cert.txt"
          printf 'Signature schemes: %s\n' "${SCHEMES:-unknown}" > "$RUNNER_TEMP/schemes.txt"
          echo "certificate SHA-256: ${DIGEST:-unreadable}"
          cat "$RUNNER_TEMP/schemes.txt"

      - name: Publish the install link
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view taal-latest > /dev/null 2>&1 || \
            gh release create taal-latest --title "Taal - latest debug APK"
          gh release edit taal-latest --notes "Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}, run ${GITHUB_RUN_ID}.
          Install: https://github.com/${GITHUB_REPOSITORY}/releases/download/taal-latest/app-debug.apk
          Certificate SHA-256: $(cat "$RUNNER_TEMP/cert.txt")
          $(cat "$RUNNER_TEMP/schemes.txt" 2>/dev/null || true)
          Debug-signed, so sideload only. Your cards are stored on the phone; back up in Settings before switching keys."
          gh release upload taal-latest android/app/build/outputs/apk/debug/app-debug.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: taal-apk
          path: dutch-learning/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
