name: Bike Lot (web checks + Android APK)

on:
  push:
    branches: ["**"]
    paths:
      - "bike-parking/**"
      - ".github/workflows/bike-parking.yml"
  pull_request:
    paths:
      - "bike-parking/**"
      - ".github/workflows/bike-parking.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: bike-parking

jobs:
  web:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bike-parking/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Keep the single-file web build
        uses: actions/upload-artifact@v4
        with:
          name: bike-lot-web
          path: bike-parking/dist/index.html
          if-no-files-found: error

  android:
    name: Debug APK
    needs: web
    runs-on: ubuntu-latest
    # Publishing the install link needs to write a release; the GDRIVE_* values
    # are read at job level so a step's own `if:` can test whether they exist.
    permissions:
      contents: write
    env:
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bike-parking/package-lock.json

      # Capacitor 8 builds against a recent Android SDK and needs JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # GitHub's Ubuntu runners already ship the Android SDK, so no setup action
      # is needed — and the one that used to be recommended breaks under Node 24.
      # This step just proves the toolchain is there before anything slow runs.
      - name: Android SDK preflight
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          java -version
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true

      - run: npm ci
      - run: npm run build

      # The native project is generated here rather than committed: it is a
      # build artifact of `capacitor.config.ts` and rots if kept in the repo.
      - name: Create the Android project
        run: npx cap add android

      - name: Sync the web build into it
        run: npx cap sync android

      # Android 11+ hides other apps unless their intents are declared. Capacitor asks
      # whether anything handles ACTION_IMAGE_CAPTURE before launching the camera, so
      # without this the "Take photo" button silently opens the photo picker instead.
      - name: Declare the camera intent
        run: python3 scripts/patch-android-manifest.py

      - name: Accept SDK licences
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            echo "licences accepted with $SDKMANAGER"
          else
            echo "no sdkmanager on this image — Gradle will use what is installed"
          fi

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # Each CI runner generates its own debug keystore, so without this every
      # build has a different key and the next APK refuses to install over the
      # previous one - and uninstalling deletes the database. See keystore/README.md.
      - name: Sign with the pinned key
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          TOOLS="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign \
            --ks keystore/bike-lot.p12 \
            --ks-key-alias bikelot \
            --ks-pass pass:bikelot-dev-key \
            --key-pass pass:bikelot-dev-key \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          cp "$RUNNER_TEMP/signed.apk" "$APK"
          echo "signed; verifying:"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Report the APK
        run: |
          grep -A4 "<queries>" android/app/src/main/AndroidManifest.xml
          ls -lh android/app/build/outputs/apk/debug/
          du -h android/app/build/outputs/apk/debug/app-debug.apk

      # Which key signed this build? It decides whether a new APK installs over the
      # previous one (keeping the data) or demands an uninstall (losing it). The
      # digest is published in the release notes, so it can be compared run to run
      # without downloading anything.
      - name: Note the signing certificate
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)/apksigner"
          RAW="$RUNNER_TEMP/verify.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RAW" 2>&1 || true

          DIGEST="$(tr -d ':' < "$RAW" | grep -o -E '[0-9a-fA-F]{64}' | head -1 | tr 'A-F' 'a-f')"
          SCHEMES="$(grep -E '^Verified using v' "$RAW" | tr '\n' ' ' || true)"
          printf '%s\n' "${DIGEST:-unreadable}" > "$RUNNER_TEMP/cert.txt"
          printf 'Signature schemes: %s\n' "${SCHEMES:-unknown}" > "$RUNNER_TEMP/schemes.txt"
          echo "certificate SHA-256: ${DIGEST:-unreadable}"
          cat "$RUNNER_TEMP/schemes.txt"

      - name: Publish the install link
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view bike-lot-latest > /dev/null 2>&1 || \
            gh release create bike-lot-latest --title "Bike Lot - latest debug APK"
          gh release edit bike-lot-latest --notes "Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}, run ${GITHUB_RUN_ID}.
          Certificate SHA-256: $(cat "$RUNNER_TEMP/cert.txt")
          $(cat "$RUNNER_TEMP/schemes.txt" 2>/dev/null || true)
          Debug-signed, so sideload only."
          gh release upload bike-lot-latest android/app/build/outputs/apk/debug/app-debug.apk --clobber

      # Optional second delivery route: with the GDRIVE_* secrets set, every build
      # also lands in a Drive folder (see README, "Put every build in Drive").
      # Without them this stays silent and the build is unaffected.
      - name: Check the Drive uploader
        run: node scripts/upload-to-drive.mjs --check

      - name: Copy the APK to Google Drive
        if: env.GDRIVE_REFRESH_TOKEN != ''
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
        run: node scripts/upload-to-drive.mjs android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bike-lot-apk
          path: bike-parking/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
